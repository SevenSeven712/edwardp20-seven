<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>edwardp20 · 项目介绍</title>
<style>
  :root {
    --bg: #eef4f3;
    --panel: #ffffff;
    --panel-hover: #f7fbfa;
    --border: rgba(47, 143, 128, 0.18);
    --border-strong: rgba(47, 143, 128, 0.34);
    --text: #23332f;
    --text-strong: #0f201c;
    --muted: #5d7a75;
    --accent: #2f8f80;
    --accent-soft: rgba(47, 143, 128, 0.10);
    --gold: #9c7620;
    /* 白色透明毛玻璃（性能优先：低半径、无 saturate） */
    --glass: rgba(255, 255, 255, 0.52);
    --glass-hover: rgba(255, 255, 255, 0.68);
    --glass-soft: rgba(255, 255, 255, 0.40);
    --glass-border: rgba(255, 255, 255, 0.70);
    --glass-border-strong: rgba(47, 143, 128, 0.34);
    --glass-blur: blur(8px);
    --glass-shadow: 0 8px 30px rgba(23, 62, 56, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  #bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
    opacity: 0.85;
    pointer-events: none;
    transform: translateZ(0);
    backface-visibility: hidden;
    contain: layout paint style;
  }
  /* 静态遮罩层：替代实时 blur 滤镜，滚动时零重绘 */
  #bg-overlay {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 90% 55% at 50% 0%, rgba(255,255,255,0.30), transparent 72%),
      linear-gradient(180deg, rgba(247,251,250,0.34) 0%, rgba(243,249,248,0.44) 42%, rgba(238,244,243,0.56) 100%);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.65;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .page { max-width: 920px; margin: 0 auto; padding: 0 24px; }

  /* Hero */
  .hero { padding: 64px 0 40px; text-align: center; }

  .avatar-wrap {
    position: relative;
    width: 120px; height: 120px;
    margin: 0 auto 22px;
  }
  .avatar-wrap::before {
    content: "";
    position: absolute;
    inset: -22px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(47,143,128,0.24) 0%, rgba(47,143,128,0.07) 45%, transparent 70%);
    animation: glowPulse 3.6s ease-in-out infinite;
    pointer-events: none;
    will-change: opacity;
  }
  .avatar-wrap::after {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1px solid rgba(47,143,128,0.38);
    animation: ringPulse 3.6s ease-out infinite;
    pointer-events: none;
    will-change: transform, opacity;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  @keyframes ringPulse {
    0% { transform: scale(1); opacity: 0.75; }
    70% { transform: scale(1.28); opacity: 0; }
    100% { transform: scale(1.28); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .avatar-wrap::before, .avatar-wrap::after { animation: none; }
    html { scroll-behavior: auto; }
  }
  .avatar {
    position: relative;
    z-index: 1;
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.85);
    object-fit: cover;
    background: #fff;
    box-shadow: 0 6px 22px rgba(23, 62, 56, 0.16);
  }

  .name {
    font-size: 31px;
    font-weight: 600;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #123a34 0%, #2f8f80 55%, #43b3a1 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    display: inline-block;
  }
  .handle { color: var(--muted); font-size: 14px; margin-top: 2px; letter-spacing: 0.3px; }
  .bio { margin-top: 18px; color: var(--muted); font-size: 15px; max-width: 560px; margin-left: auto; margin-right: auto; }

  .links { margin-top: 24px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .links a {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 16px;
    border: 1px solid var(--glass-border);
    border-radius: 5px;
    font-size: 13.5px;
    color: var(--text);
    background: var(--glass);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
    transition: border-color 0.2s, background-color 0.2s, color 0.2s;
  }
  .links a:hover {
    border-color: var(--accent);
    background-color: var(--glass-hover);
    color: var(--accent);
    text-decoration: none;
  }
  .links a svg { color: var(--accent); }

  .skills { margin-top: 28px; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
  .skill {
    font-size: 12px;
    padding: 3px 12px;
    border-radius: 4px;
    background: var(--glass-soft);
    border: 1px solid var(--glass-border);
    color: var(--accent);
    letter-spacing: 0.3px;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }

  /* Section */
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 44px 0 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(47, 143, 128, 0.16);
  }
  .section-head h2 {
    font-size: 20px; font-weight: 600;
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(120deg, #14322d 0%, #2f8f80 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }
  .section-head h2::before {
    content: ""; width: 3px; height: 18px; background: var(--accent); border-radius: 2px;
  }
  .count { color: var(--muted); font-size: 13px; }

  /* Grid */
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }

  .card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    overflow: hidden;
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
    box-shadow: 0 2px 12px rgba(0,0,0,0.10);
    contain: layout paint style;
    content-visibility: auto;
    contain-intrinsic-size: auto 150px;
    transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover {
    border-color: var(--glass-border-strong);
    background-color: var(--glass-hover);
    box-shadow: var(--glass-shadow);
  }
  .card.open {
    border-color: var(--accent);
    background-color: var(--glass-hover);
  }

  .card-head { padding: 18px 20px; cursor: pointer; }
  .card-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .card-title-row h3 {
    font-size: 17px; font-weight: 600; color: var(--text-strong);
    word-break: break-all; letter-spacing: 0.2px;
  }
  .chev { color: var(--muted); flex-shrink: 0; transition: transform 0.25s; }
  .card.open .chev { transform: rotate(180deg); color: var(--accent); }

  .card-brief { color: var(--muted); font-size: 13.5px; margin-top: 5px; }

  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .badge {
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 4px;
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.30);
    color: var(--muted);
    white-space: nowrap;
    letter-spacing: 0.3px;
  }
  .badge-lang { border-color: rgba(47,143,128,0.38); color: var(--accent); background: rgba(47,143,128,0.06); }
  .badge-lic { border-color: rgba(156,118,32,0.38); color: var(--gold); background: rgba(156,118,32,0.06); }
  .badge-star { border-color: rgba(156,118,32,0.38); color: var(--gold); background: rgba(156,118,32,0.06); }
  .badge-fork { border-color: var(--border-strong); color: var(--muted); background: rgba(47,143,128,0.05); }

  .card-detail {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .card.open .card-detail {
    will-change: max-height;
  }
  .card.open .card-detail { max-height: 700px; }
  .detail-inner {
    padding: 0 20px 20px;
    border-top: 1px solid rgba(47, 143, 128, 0.16);
    margin-top: 2px;
  }
  .detail-summary {
    color: var(--text);
    font-size: 14px;
    padding-top: 16px;
    line-height: 1.7;
  }
  .detail-points { list-style: none; margin: 14px 0 0; }
  .detail-points li {
    position: relative;
    padding-left: 18px;
    font-size: 13.5px;
    color: var(--muted);
    margin-bottom: 6px;
    line-height: 1.6;
  }
  .detail-points li::before {
    content: "";
    position: absolute;
    left: 2px; top: 9px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.7;
  }
  .detail-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .detail-link {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px;
    border: 1px solid var(--glass-border-strong);
    border-radius: 5px;
    font-size: 13px;
    color: var(--accent);
    background: var(--glass-soft);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: background-color 0.2s, border-color 0.2s;
  }
  .detail-link:hover {
    background-color: var(--glass-hover);
    border-color: var(--accent);
    text-decoration: none;
  }

  /* Footer */
  footer {
    margin-top: 56px;
    padding: 26px 0 40px;
    border-top: 1px solid rgba(47, 143, 128, 0.16);
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    letter-spacing: 0.3px;
  }

  /* Language FAB */
  .lang-fab {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  .lang-menu {
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--glass-hover);
    border: 1px solid var(--glass-border-strong);
    border-radius: 6px;
    padding: 5px;
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    opacity: 0;
    transform: translateY(8px) scale(0.96);
    transform-origin: bottom right;
    pointer-events: none;
    transition: opacity 0.18s, transform 0.18s;
  }
  .lang-menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .lang-menu button {
    background: none;
    border: none;
    color: var(--text);
    padding: 7px 22px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    text-align: left;
    white-space: nowrap;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .lang-menu button:hover { background: var(--accent-soft); color: var(--accent); }
  .lang-menu button.active { color: var(--accent); font-weight: 600; }
  .lang-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--glass);
    border: 1px solid var(--glass-border-strong);
    color: var(--accent);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
  }
  .lang-btn:hover { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .lang-btn:active { transform: scale(0.94); }

  /* 浏览器不支持毛玻璃时的实色降级 */
  @supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))) {
    .card, .links a, .skill, .detail-link, .lang-menu, .lang-btn {
      background: rgba(255, 255, 255, 0.92);
    }
  }
  /* 系统要求减少透明/动态效果时，关闭毛玻璃保性能 */
  @media (prefers-reduced-transparency: reduce) {
    .card, .links a, .skill, .detail-link, .lang-menu, .lang-btn {
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      background: rgba(255, 255, 255, 0.94);
    }
  }
  /* 小屏 / 窄窗口：关闭毛玻璃，避免移动端 GPU 压力 */
  @media (max-width: 768px) {
    .card, .links a, .skill, .detail-link, .lang-menu, .lang-btn {
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
    .card { background: rgba(255, 255, 255, 0.86); }
    .links a, .skill, .detail-link, .lang-menu, .lang-btn { background: rgba(255, 255, 255, 0.80); }
    #bg-video { opacity: 0.6; }
  }

  @media (max-width: 520px) {
    .page { padding: 0 16px; }
    .hero { padding: 48px 0 32px; }
    .name { font-size: 26px; }
    .card-head { padding: 16px; }
    .detail-inner { padding: 0 16px 16px; }
    .lang-fab { right: 16px; bottom: 16px; }
  }
</style>

var lang = "zh";
var openSet = {};

function applyStaticText() {
  var dict = I18N[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = dict.title;
  var nodes = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < nodes.length; i++) {
    var key = nodes[i].getAttribute("data-i18n");
    if (dict[key] !== undefined) nodes[i].textContent = dict[key];
  }
  var btns = document.querySelectorAll("#langMenu button");
  for (var j = 0; j < btns.length; j++) {
    btns[j].classList.toggle("active", btns[j].getAttribute("data-lang") === lang);
  }
}

function renderProjects() {
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  var dict = I18N[lang];
  var chevSvg = '<svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
  var extSvg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M9 7h8v8"/></svg>';

  PROJECTS.forEach(function(p) {
    var d = p[lang];
    var card = document.createElement("article");
    card.className = "card";
    if (openSet[p.name]) card.classList.add("open");

    var meta = [];
    if (p.lang) meta.push('<span class="badge badge-lang">' + p.lang + '</span>');
    if (p.license && p.license !== "NOASSERTION") {
      meta.push('<span class="badge badge-lic">' + p.license + '</span>');
    } else if (p.license === "NOASSERTION") {
      meta.push('<span class="badge badge-lic">' + dict.other + '</span>');
    }
    if (p.stars > 0) meta.push('<span class="badge badge-star">★ ' + p.stars + '</span>');
    if (p.fork) meta.push('<span class="badge badge-fork">Fork</span>');

    var pointsHtml = d.points.map(function(pt) { return '<li>' + pt + '</li>'; }).join("");
    var linksHtml = "";
    if (p.homepage) {
      linksHtml += '<a class="detail-link" href="' + p.homepage + '" target="_blank" rel="noopener">' + extSvg + dict.homepage + '</a>';
    }
    linksHtml += '<a class="detail-link" href="' + p.url + '" target="_blank" rel="noopener">' + extSvg + dict.visit + '</a>';

    card.innerHTML =
      '<div class="card-head">' +
        '<div class="card-title-row">' +
          '<h3>' + p.name + '</h3>' + chevSvg +
        '</div>' +
        '<p class="card-brief">' + d.brief + '</p>' +
        '<div class="meta">' + meta.join("") + '</div>' +
      '</div>' +
      '<div class="card-detail">' +
        '<div class="detail-inner">' +
          '<p class="detail-summary">' + d.summary + '</p>' +
          '<ul class="detail-points">' + pointsHtml + '</ul>' +
          '<div class="detail-links">' + linksHtml + '</div>' +
        '</div>' +
      '</div>';

    (function(name) {
      card.querySelector(".card-head").addEventListener("click", function() {
        var isOpen = card.classList.toggle("open");
        if (isOpen) openSet[name] = true; else delete openSet[name];
      });
    })(p.name);

    grid.appendChild(card);
  });

  var countEl = document.getElementById("count");
  countEl.textContent = lang === "zh"
    ? "共 " + PROJECTS.length + " 个项目"
    : PROJECTS.length + " projects";
}

function applyLang(l) {
  lang = l;
  try { localStorage.setItem("edwardp20-lang", l); } catch (e) {}
  applyStaticText();
  renderProjects();
}

document.getElementById("langBtn").addEventListener("click", function(e) {
  e.stopPropagation();
  document.getElementById("langMenu").classList.toggle("open");
});
document.getElementById("langMenu").addEventListener("click", function(e) {
  var btn = e.target.closest("button");
  if (!btn) return;
  var l = btn.getAttribute("data-lang");
  applyLang(l);
  document.getElementById("langMenu").classList.remove("open");
});
document.addEventListener("click", function() {
  document.getElementById("langMenu").classList.remove("open");
});

(function init() {
  var saved = null;
  try { saved = localStorage.getItem("edwardp20-lang"); } catch (e) {}
  applyLang(saved === "en" ? "en" : "zh");
})();
</script>
